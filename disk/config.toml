# bootc-image-builder's config for the disk image (task build-disk-image).
# No user: the image has none, so plasma-setup (Aurora's, enabled by
# default) creates the first one at first boot. Only the disk's minimum
# size (customizations.filesystem isn't supported for disk images); a
# qcow2 is sparse, so the download is the size of what's written, not 64
# GiB.
[customizations.disk]
minsize = "64 GiB"
