# Graceful nightly updates (../../../libexec/quine-linux/update-*):
# - skip the run while the newest image is one a user rolled back from;
# - on failure (after uupd's own retries), record why, for the update bar;
# - on success, forget the last failure.
[Unit]
OnFailure=quine-update-failed.service

[Service]
ExecCondition=/usr/libexec/quine-linux/update-skip-rejected
ExecStartPost=-/usr/bin/rm -f /var/lib/quine-linux/last-update-failure.json
